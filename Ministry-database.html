<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search the Department of Interstellar Affairs Database.">
  <title>Ministry Database</title>
  <link rel="stylesheet" href="ministry-database.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Right Ministry Insignia -->
  <header class="header-seal">
    <div class="seal-container">
      <svg class="mod-emblem" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Center crosshairs extending outside the diamond -->
        <line x1="50" y1="0" x2="50" y2="100" stroke="#000000" stroke-width="4.5" stroke-linecap="square"/>
        <line x1="0" y1="50" x2="100" y2="50" stroke="#000000" stroke-width="4.5" stroke-linecap="square"/>
        <!-- Diamond frame -->
        <polygon points="50,15 85,50 50,85 15,50" stroke="#000000" stroke-width="4.5" fill="none" stroke-linejoin="miter"/>
        <!-- Inscribed circle -->
        <circle cx="50" cy="50" r="24.7" stroke="#000000" stroke-width="4.5" fill="none"/>
      </svg>
      <div class="seal-typography">
        <span class="seal-line bold">MINISTRY OF DEFENCE</span>
        <span class="seal-line">DEPARTMENT OF</span>
        <span class="seal-line">INTERSTELLAR AFFAIRS</span>
      </div>
    </div>
  </header>

  <!-- Central Visual Core (Optically elevated) -->
  <main class="core-stage">
    
    <h1 class="main-title">MINISTRY DATABASE</h1>

    <div class="search-module">
      <div class="input-shell">
        <!-- Clean Archival Folder Icon -->
        <input 
          type="text" 
          id="query-input" 
          placeholder="Search the database..." 
          autocomplete="off" 
          spellcheck="false"
        >
      </div>
    </div>

    <!-- 4 Archival Classification Categories -->
    <nav class="category-row">
      <button class="cat-link" data-cat="PERSON">PERSON</button>
      <button class="cat-link" data-cat="ARTICLE">ARTICLE</button>
      <button class="cat-link" data-cat="PLACE">PLACE</button>
      <button class="cat-link" data-cat="TIME">TIME</button>
    </nav>

  </main>

  <!-- Bottom Telemetry Trim -->
  <footer class="bottom-trim">
    <div class="telemetry-node">
      <span class="node-label">EARTH</span>
      <div class="led-bezel">
        <div class="led-core"></div>
      </div>
    </div>
  </footer>

  <script>
    // Subtle interactivity without token bloat
    const input = document.getElementById('query-input');
    const buttons = document.querySelectorAll('.cat-link');

    // Redirect category buttons to credentials
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        window.location.href = 'credentials.html';
      });
    });

    // Enter key feedback
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && input.value.trim() !== '') {
        window.location.href = 'credentials.html';
      }
    });
  </script>
</body>
</html>
