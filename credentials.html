<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credentials — Ministry Database</title>
  <link rel="stylesheet" href="credentials.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Right Ministry Insignia -->
  <header class="header-seal">
    <div class="seal-container">
      <svg class="mod-emblem" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="50" y1="0" x2="50" y2="100" stroke="#000000" stroke-width="4.5" stroke-linecap="square"/>
        <line x1="0" y1="50" x2="100" y2="50" stroke="#000000" stroke-width="4.5" stroke-linecap="square"/>
        <polygon points="50,15 85,50 50,85 15,50" stroke="#000000" stroke-width="4.5" fill="none" stroke-linejoin="miter"/>
        <circle cx="50" cy="50" r="24.7" stroke="#000000" stroke-width="4.5" fill="none"/>
      </svg>
      <div class="seal-typography">
        <span class="seal-line bold">MINISTRY OF DEFENCE</span>
        <span class="seal-line">DEPARTMENT OF</span>
        <span class="seal-line">INTERSTELLAR AFFAIRS</span>
      </div>
    </div>
  </header>

  <!-- Central Visual Core -->
  <main class="core-stage">
    
    <h1 class="main-title">CREDENTIALS</h1>

    <form id="auth-form" class="auth-module" autocomplete="off" onsubmit="return false;">
      
      <!-- Field Title / Label -->
      <label for="id-input" class="field-title">ENTER YOUR IDENTIFICATION TO CONTINUE</label>

      <!-- Crisp Square Input Box -->
      <div class="input-shell" id="input-shell">
        <input 
          type="text" 
          id="id-input" 
          autocomplete="off" 
          spellcheck="false"
        >
      </div>

      <!-- State & Error Feedback -->
      <div class="feedback-anchor">
        <p id="auth-feedback" class="feedback-text"></p>
      </div>
    </form>

  </main>

  <!-- Bottom Telemetry Trim -->
  <footer class="bottom-trim">
    <div class="telemetry-node">
      <span class="node-label">EARTH</span>
      <div class="led-bezel">
        <div class="led-core"></div>
      </div>
    </div>
  </footer>

  <script>
    const STORAGE_KEY_LOCKED = 'mod_terminal_locked';
    const STORAGE_KEY_ATTEMPTS = 'mod_terminal_attempts';
    const MAX_ATTEMPTS = 12;

    const input = document.getElementById('id-input');
    const inputShell = document.getElementById('input-shell');
    const feedback = document.getElementById('auth-feedback');
    const form = document.getElementById('auth-form');

    function verifyTerminalSecurity() {
      const isLocked = localStorage.getItem(STORAGE_KEY_LOCKED) === 'true';

      if (isLocked) {
        applyPermanentLockout();
      } else {
        input.focus();
      }
    }

    function applyPermanentLockout() {
      localStorage.setItem(STORAGE_KEY_LOCKED, 'true');
      input.value = '';
      input.disabled = true;
      inputShell.classList.add('locked');
      feedback.textContent = "Contact your local operative";
      feedback.className = "feedback-text locked-state";
    }

    function handleSubmission() {
      const isLocked = localStorage.getItem(STORAGE_KEY_LOCKED) === 'true';
      if (isLocked) return;

      const enteredVal = input.value.trim();
      if (!enteredVal) return;

      let attempts = parseInt(localStorage.getItem(STORAGE_KEY_ATTEMPTS) || '0', 10);
      attempts += 1;
      localStorage.setItem(STORAGE_KEY_ATTEMPTS, attempts);

      if (attempts >= MAX_ATTEMPTS) {
        applyPermanentLockout();
      } else {
        feedback.textContent = "Invalid Credentials";
        feedback.className = "feedback-text error-state";
        inputShell.classList.add('shake');

        setTimeout(() => {
          inputShell.classList.remove('shake');
        }, 350);

        input.value = '';
        input.focus();
      }
    }

    form.addEventListener('submit', handleSubmission);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleSubmission();
      }
    });

    verifyTerminalSecurity();
  </script>
</body>
</html>
